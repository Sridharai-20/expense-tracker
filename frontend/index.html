<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>💰 Personal Expense Tracker</h1>
            <p>Record and monitor your daily expenses</p>
        </header>

        <!-- Summary -->
        <section class="summary">

            <div class="summary-card">
                <h3>Total Expense</h3>
                <p id="totalExpense">₹0</p>
            </div>

            <div class="summary-card">
                <h3>Monthly Expense</h3>
                <p id="monthlyExpense">₹0</p>
            </div>

            <div class="summary-card">
                <h3>Total Records</h3>
                <p id="totalRecords">0</p>
            </div>

        </section>

        <!-- Add Expense -->
        <section class="form-section">

            <h2>Add Expense</h2>

            <form id="expenseForm">

                <input
                    type="hidden"
                    id="expenseId"
                >

                <div class="form-group">

                    <label>Expense Name</label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Example: Food"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Amount</label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Example: 150"
                        min="1"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Category</label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Date</label>

                    <input
                        type="date"
                        id="expenseDate"
                        required
                    >

                </div>

                <button type="submit" id="submitBtn">
                    Add Expense
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="cancel"
                    onclick="cancelEdit()"
                >
                    Cancel
                </button>

            </form>

        </section>

        <!-- Search -->
        <section class="search-section">

            <h2>Search & Filter</h2>

            <div class="search-box">

                <input
                    type="text"
                    id="search"
                    placeholder="Search expense..."
                >

                <select id="filterCategory">

                    <option value="All">
                        All Categories
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Transport">
                        Transport
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>

        </section>

        <!-- Expenses -->
        <section class="expenses-section">

            <h2>Expense History</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="expenseTable">
                    </tbody>

                </table>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
